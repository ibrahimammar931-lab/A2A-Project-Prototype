<div class="launcher-container">
  <div class="launcher-fields">
    <mat-form-field appearance="outline" class="field-issue">
      <mat-label>Issue Key</mat-label>
      <input
        matInput
        [(ngModel)]="issueKey"
        placeholder="PROJ-123"
        [disabled]="loading"
      />
      <mat-icon matSuffix>confirmation_number</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-branch">
      <mat-label>Base Branch</mat-label>
      <input
        matInput
        [(ngModel)]="baseBranch"
        placeholder="main"
        [disabled]="loading"
      />
      <mat-icon matSuffix>call_split</mat-icon>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      class="start-btn"
      [disabled]="loading"
      (click)="startWorkflow()"
    >
      <mat-icon *ngIf="!loading">play_arrow</mat-icon>
      <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
      <span>{{ loading ? 'Starting...' : 'Start Workflow' }}</span>
    </button>
  </div>
</div>
