<h3 class="panel-title">Agent Details</h3>

<mat-card *ngIf="agent; else noSelection" class="detail-card">
  <mat-card-header>
    <mat-icon
      mat-card-avatar
      [style.color]="getStatusColor(agent.status)"
      class="detail-icon"
    >
      {{ getStatusIcon(agent.status) }}
    </mat-icon>
    <mat-card-title>{{ agent.name }}</mat-card-title>
    <mat-card-subtitle>
      <span
        class="status-badge"
        [style.background]="getStatusColor(agent.status)"
      >
        {{ agent.status }}
      </span>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content class="detail-content">
    <div class="detail-row">
      <span class="detail-label">Start Time</span>
      <span class="detail-value">{{ agent.startTime || '—' }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">End Time</span>
      <span class="detail-value">{{ agent.endTime || '—' }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Duration</span>
      <span class="detail-value">{{ agent.duration || '—' }}</span>
    </div>

    <div *ngIf="errorMessage" class="error-section">
      <mat-divider></mat-divider>
      <div class="error-message">
        <mat-icon class="error-icon">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<ng-template #noSelection>
  <div class="no-selection">
    <mat-icon class="no-selection-icon">touch_app</mat-icon>
    <p>Select an agent from the pipeline to view details</p>
  </div>
</ng-template>
