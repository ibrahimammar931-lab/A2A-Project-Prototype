<div class="controls-container">
  <button mat-stroked-button class="control-btn pause-btn" (click)="pause()">
    <mat-icon>pause_circle</mat-icon>
    Pause
  </button>
  <button mat-stroked-button class="control-btn resume-btn" (click)="resume()">
    <mat-icon>play_circle</mat-icon>
    Resume
  </button>
  <button mat-stroked-button class="control-btn stop-btn" (click)="stop()">
    <mat-icon>stop_circle</mat-icon>
    Stop
  </button>
</div>
