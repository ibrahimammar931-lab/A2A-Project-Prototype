<h3 class="panel-title">Log Console</h3>
<div class="log-container" #logContainer (scroll)="onScroll($event)">
  <div *ngIf="logs.length === 0" class="log-empty">
    <mat-icon>terminal</mat-icon>
    <p>No logs yet. Start a workflow to see output here.</p>
  </div>
  <div *ngFor="let log of logs" class="log-entry">
    <span class="log-time">{{ log.time }}</span>
    <span class="log-agent">[{{ log.agent }}]</span>
    <span class="log-message">{{ log.message }}</span>
  </div>
</div>
