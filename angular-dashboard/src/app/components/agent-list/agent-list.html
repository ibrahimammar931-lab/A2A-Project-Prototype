<h3 class="panel-title">Pipeline Agents</h3>
<mat-nav-list>
  <mat-list-item
    *ngFor="let agent of agents"
    [class.selected]="agent.id === selectedAgentId"
    (click)="selectAgent(agent)"
    class="agent-item"
  >
    <mat-icon
      matListItemIcon
      [style.color]="getStatusColor(agent.status)"
      class="status-icon"
    >
      {{ getStatusIcon(agent.status) }}
    </mat-icon>
    <span matListItemTitle>{{ agent.name }}</span>
    <span
      matListItemLine
      class="status-label"
      [style.color]="getStatusColor(agent.status)"
    >
      {{ agent.status }}
    </span>
  </mat-list-item>
</mat-nav-list>
