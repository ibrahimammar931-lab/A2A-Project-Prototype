<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="toolbar-icon">dashboard</mat-icon>
  <span class="toolbar-title">{{ title() }}</span>
  <span class="toolbar-spacer"></span>

  <app-pipeline-controls></app-pipeline-controls>

  <!-- Connection status indicator -->
  <span class="connection-status" [class.connected]="pipelineRunning">
    <mat-icon>{{ pipelineRunning ? 'cell_tower' : 'cell_tower' }}</mat-icon>
  </span>
</mat-toolbar>

<!-- Workflow Launcher Section -->
<div class="launcher-section">
  <app-workflow-launcher></app-workflow-launcher>
</div>

<!-- Pipeline Status Banner -->
<div *ngIf="pipelineFinished" class="pipeline-banner" [class.success]="!pipelineFailed" [class.failed]="pipelineFailed">
  <mat-icon>{{ pipelineFailed ? 'error' : 'check_circle' }}</mat-icon>
  <span>{{ pipelineFailed ? 'Pipeline failed' : 'Pipeline completed successfully' }}</span>
</div>

<!-- Main Dashboard Grid -->
<div class="dashboard-grid">
  <!-- Left Panel: Agent List -->
  <div class="panel panel-left">
    <app-agent-list
      [agents]="agents"
      [selectedAgentId]="selectedAgent?.id ?? null"
      (agentSelected)="onAgentSelected($event)"
    ></app-agent-list>
  </div>

  <!-- Center Panel: Agent Details -->
  <div class="panel panel-center">
    <app-agent-detail
      [agent]="selectedAgent"
      [errorMessage]="selectedAgent?.errorMessage ?? null"
    ></app-agent-detail>
  </div>

  <!-- Right Panel: Log Console -->
  <div class="panel panel-right">
    <app-log-console [logs]="logs"></app-log-console>
  </div>
</div>
